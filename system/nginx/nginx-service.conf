# Managed by the Atlas updater: a sandbox for nginx, Atlas's only network entry
# point (/etc/systemd/system/nginx.service.d/atlas.conf). nginx reads its
# configuration, the TLS key, the release's assets and the maps; it writes only
# its logs, its cache and its pid file. The master process starts as root to
# bind ports 80/443 and read the key, then serves as www-data.
[Service]
NoNewPrivileges=yes
ProtectSystem=full
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
