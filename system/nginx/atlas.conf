# Managed by the Atlas updater — replaced on every update; do not edit.
# nginx is the only network entry point. The app listens on 127.0.0.1:5000
# and trusts forwarded client addresses only with the per-device secret
# added by atlas-proxy.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone  $binary_remote_addr zone=atlas_api:10m     rate=10r/s;
limit_req_zone  $binary_remote_addr zone=atlas_ai:10m      rate=10r/m;
limit_req_zone  $binary_remote_addr zone=atlas_connect:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=atlas_pair:10m    rate=6r/m;
limit_conn_zone $binary_remote_addr zone=atlas_perip:10m;

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     @ATLAS_TLS_CERT@;
    ssl_certificate_key @ATLAS_TLS_KEY@;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:atlas_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 4M;
    limit_conn atlas_perip 64;
    # Throttled is 429 — never 503, which error_page below would turn into
    # "Atlas is restarting".
    limit_req_status  429;
    limit_conn_status 429;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript application/javascript application/json
                    image/svg+xml application/manifest+json application/geo+json font/ttf font/otf;

    # While Atlas restarts (updates, reboots) answer with status instead of a
    # bare 502, so browsers and the phone apps can say what is happening.
    error_page 502 503 504 =503 @atlas_down;
    location @atlas_down {
        include /etc/nginx/snippets/atlas-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After   "5"        always;
        if ($uri ~ ^/(api|socket\.io)/) {
            return 503 '{"error":"Atlas is restarting","code":"atlas_restarting"}';
        }
        root /usr/local/lib/atlas/www;
        try_files /updating.html =503;
    }
    location = /update-status.json {
        include /etc/nginx/snippets/atlas-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        alias /run/atlas-update/status.json;
    }

    # ── The active release's own assets (served straight from disk) ─────
    location /static/build/ {
        include /etc/nginx/snippets/atlas-headers.conf;
        alias /opt/atlas/current/static/build/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    location /static/vendor/ {
        include /etc/nginx/snippets/atlas-headers.conf;
        alias /opt/atlas/current/static/vendor/;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }
    location /static/js/ {
        include /etc/nginx/snippets/atlas-headers.conf;
        alias /opt/atlas/current/static/js/;
        add_header Cache-Control "no-cache" always;
    }
    location /static/img/ {
        include /etc/nginx/snippets/atlas-headers.conf;
        alias /opt/atlas/current/static/img/;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }
    location = /static/app.compiled.js {
        include /etc/nginx/snippets/atlas-headers.conf;
        alias /opt/atlas/current/static/app.compiled.js;
        add_header Cache-Control "no-cache" always;
    }

    # ── Device datasets (maps) ──────────────────────────────────────────
    location /static/fonts/ {
        include /etc/nginx/snippets/atlas-headers.conf;
        alias @ATLAS_STATE_DIR@/static/fonts/;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }
    location /tiles/topo/ {
        include /etc/nginx/snippets/atlas-headers.conf;
        root @ATLAS_STATE_DIR@/static;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri /tiles/transparent.png;
    }
    location ~ ^/tiles/(topo|map)\.pmtiles$ {
        include /etc/nginx/snippets/atlas-headers.conf;
        root @ATLAS_STATE_DIR@/static;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Accept-Ranges bytes always;
    }
    location /tiles/ {
        include /etc/nginx/snippets/atlas-headers.conf;
        root @ATLAS_STATE_DIR@/static;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # ── The app ─────────────────────────────────────────────────────────
    location ~ ^/api/ai/chats/[0-9]+/stream$ {
        limit_req zone=atlas_ai burst=5 nodelay;
        include /etc/nginx/snippets/atlas-proxy.conf;
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location ~ ^/api/nav/(route|navigate) {
        limit_req zone=atlas_api burst=100 nodelay;
        include /etc/nginx/snippets/atlas-proxy.conf;
        proxy_read_timeout 600s;
    }
    location ~ ^/api/(wifi/connect|hotspot/start|hotspot/config) {
        limit_req zone=atlas_connect burst=3 nodelay;
        include /etc/nginx/snippets/atlas-proxy.conf;
        proxy_read_timeout 60s;
    }
    # Only the requests that carry a proof (setup code, hotspot, a new
    # approval request) are held to the pairing rate; waiting for an
    # approval polls every 2 s and goes through the general API limit.
    location ~ ^/api/pair/(claim|hotspot|request)$ {
        limit_req zone=atlas_pair burst=6 nodelay;
        include /etc/nginx/snippets/atlas-proxy.conf;
        proxy_read_timeout 30s;
    }
    location /api/ {
        limit_req zone=atlas_api burst=100 nodelay;
        include /etc/nginx/snippets/atlas-proxy.conf;
        proxy_read_timeout 60s;
    }
    location / {
        include /etc/nginx/snippets/atlas-proxy.conf;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
