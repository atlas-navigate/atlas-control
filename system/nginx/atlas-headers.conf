# Managed by the Atlas updater. Security headers for responses nginx serves
# itself (the app adds its own to proxied responses). add_header is not
# inherited into locations that set their own, hence the include.
add_header X-Frame-Options        "DENY"        always;
add_header X-Content-Type-Options "nosniff"     always;
add_header Referrer-Policy        "no-referrer" always;
