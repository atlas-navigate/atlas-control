# Managed by the Atlas updater. Included in every location that proxies to
# the Atlas app. proxy_set_header is not inherited into a location that sets
# its own, so every proxied location includes this whole block.
proxy_pass         http://127.0.0.1:5000;
proxy_http_version 1.1;
proxy_set_header   Host               $host;
proxy_set_header   X-Real-IP          $remote_addr;
proxy_set_header   X-Forwarded-For    $remote_addr;
proxy_set_header   X-Forwarded-Proto  $scheme;
proxy_set_header   X-Atlas-Local-Addr $server_addr;
proxy_set_header   Upgrade            $http_upgrade;
proxy_set_header   Connection         $connection_upgrade;
# Per-device secret proving to the app that this request came through nginx.
include            @ATLAS_PROXY_SECRET_CONF@;
proxy_connect_timeout 10s;
