# Managed by the Atlas updater: Atlas's settings for Ollama's model runners
# (llama-server reads LLAMA_ARG_* from its environment, which Ollama passes on).
#
# llama-server keeps earlier prompts' processed state in RAM so it can switch
# back to a conversation without processing it again. Its default limit is
# 8 GiB — all of an 8 GB Atlas. Measured: each Ray prompt added ~48 MB
# (Qwen2.5 3B) or ~134 MB (Qwen3.5 4B, with its checkpoints); over 21 Qwen3.5
# turns free memory went from 689 MB to 0, Atlas swapped, and time to the
# first word tripled. 128 MiB keeps two recent Qwen2.5 prompts (e.g. the
# conversation a calculator question interrupted); Qwen3.5 can only reuse a
# prompt at its own checkpoints, so for it the cache bought nothing.
[Service]
Environment="LLAMA_ARG_CACHE_RAM=128"
