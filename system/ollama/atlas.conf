# Managed by the Atlas updater: Atlas's settings for Ollama's model runners
# (llama-server reads LLAMA_ARG_* from its environment, which Ollama passes on).
#
# llama-server keeps every earlier prompt's processed state in RAM so it can
# switch back to a conversation without processing it again. Its default
# limit is 8 GiB — the whole memory of an 8 GB Atlas — so over a long session
# it pushed Atlas into swap. 256 MiB keeps the few recent states that matter
# (e.g. the conversation a calculator question interrupted).
[Service]
Environment="LLAMA_ARG_CACHE_RAM=256"
