# Managed by the Atlas updater: how Atlas runs Ollama. install.sh writes only
# the base unit (account, binary, model directory); everything tuned or
# measured lives here, so every update can correct it on every unit.

[Service]
# ── Ray's models ─────────────────────────────────────────────────────────
# One request at a time; Ray serialises its own work.
Environment="OLLAMA_NUM_PARALLEL=1"
# 2 loaded models: chat model + embedder. With a cap of 1, every RAG message
# evicts the chat model and reloads it (~10 s) — the single biggest source of
# Ray latency.
Environment="OLLAMA_MAX_LOADED_MODELS=2"
# Ray asks for its own keep-alive with every request ("Always" by default);
# this is only the fallback for anything else that talks to Ollama.
Environment="OLLAMA_KEEP_ALIVE=10h"
Environment="OLLAMA_GPU_OVERHEAD=0"
# Flash attention + q8_0 KV cache: halves KV-cache memory on the 8 GB
# shared-RAM Orin Nano with negligible quality loss (KV quant requires FA).
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# ── llama-server (reads LLAMA_ARG_* from the environment Ollama passes on) ─
# It keeps earlier prompts' processed state in RAM so it can switch back to a
# conversation without processing it again. Its default limit is 8 GiB — all
# of an 8 GB Atlas. Measured: each Ray prompt added ~48 MB (Qwen2.5 3B) or
# ~134 MB (Qwen3.5 4B, with its checkpoints); over 21 Qwen3.5 turns free
# memory went from 689 MB to 0, Atlas swapped, and time to the first word
# tripled. 128 MiB keeps two recent Qwen2.5 prompts (e.g. the conversation a
# calculator question interrupted); Qwen3.5 can only reuse a prompt at its own
# checkpoints, so for it the cache bought nothing.
Environment="LLAMA_ARG_CACHE_RAM=128"
# Before loading, llama-server moves layers to the CPU until a margin of
# device memory stays free (default 1024 MiB, plus the vision encoder's
# estimate for Qwen3.5). On the Jetson the CPU and GPU share the same RAM, so
# a layer on the CPU frees nothing — it only runs slower. Measured 2026-10-19:
# a Qwen3.5 load missed the margin by 6 MiB, ran 33 of 34 layers on the GPU,
# and generated at 13.0 instead of 14.8 tokens/s with prompts processed ~3×
# slower. A smaller margin keeps the whole model on the GPU.
Environment="LLAMA_ARG_FIT_TARGET=256"

# ── Sandbox ──────────────────────────────────────────────────────────────
# Ollama only needs its models, its own home (key, CUDA cache) and the GPU.
# Its home is filled in at install time (the account the base unit names).
# Not used here: PrivateDevices/DeviceAllow/ProtectClock (they would close the
# GPU device nodes) and MemoryDenyWriteExecute (CUDA compiles kernels at run
# time).
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=-/atlas_data/ollama -@OLLAMA_HOME@
ProtectHome=read-only
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
